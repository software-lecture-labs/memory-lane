plugins { id 'com.android.application' }

// The server address differs per developer (emulator vs. phone on the same Wi-Fi),
// so it is read from the untracked local.properties instead of being committed.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
// 10.0.2.2 is the emulator's alias for the host machine's localhost. Release builds block
// cleartext HTTP, so a production address has to be https://.
def apiBaseUrl = localProperties.getProperty('memorylane.apiBaseUrl', 'http://10.0.2.2:8080/')

android {
    namespace 'com.memorylane'
    compileSdk 35
    defaultConfig {
        applicationId 'com.memorylane'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'API_BASE_URL', "\"${apiBaseUrl}\""
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        warningsAsErrors true
        checkDependencies true
        // SDK 35 is intentionally pinned; retain all other warning/error checks.
        disable 'OldTargetApi'
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.navigation:navigation-fragment:2.10.2'
    implementation 'androidx.navigation:navigation-ui:2.10.2'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
