plugins { id 'com.android.application' }

// The server address differs per developer (emulator vs. phone on the same Wi-Fi),
// so it is read from the untracked local.properties instead of being committed.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
// 10.0.2.2 is the emulator's alias for the host machine's localhost. Release builds block
// cleartext HTTP, so a production address has to be https:// (enforced below).
def apiBaseUrl = localProperties.getProperty('memorylane.apiBaseUrl', 'http://10.0.2.2:8080/')
// Map tiles: OpenStreetMap data served by OpenFreeMap, which needs no API key or account. Another
// MapLibre style can be set per developer in local.properties (ML-15 "harita ayarını yerel yapılandır").
def mapStyleUrl = localProperties.getProperty('memorylane.mapStyleUrl', 'https://tiles.openfreemap.org/styles/positron')

// A release APK with an http:// address builds fine but every request then fails as "no
// connection", with nothing on screen pointing at the cause. Stop the release build instead.
// Hooked to preReleaseBuild so debug builds, lint and CI are not affected.
def releaseUsesHttps = apiBaseUrl.trim().toLowerCase(Locale.ROOT).startsWith('https://')
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!releaseUsesHttps) {
            throw new org.gradle.api.GradleException("Release builds need an https:// server address, but " +
                    "memorylane.apiBaseUrl is '${apiBaseUrl}'. Set an https:// address in " +
                    "mobile/local.properties before building a release.")
        }
    }
}

android {
    namespace 'com.memorylane'
    compileSdk 35
    defaultConfig {
        applicationId 'com.memorylane'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'API_BASE_URL', "\"${apiBaseUrl}\""
        buildConfigField 'String', 'MAP_STYLE_URL', "\"${mapStyleUrl}\""
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        warningsAsErrors true
        checkDependencies true
        // SDK 35 is intentionally pinned; retain all other warning/error checks.
        disable 'OldTargetApi'
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.navigation:navigation-fragment:2.10.2'
    implementation 'androidx.navigation:navigation-ui:2.10.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    // Declared directly: the memory list uses it, so it must not depend on Material's transitive version.
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // OpenStreetMap-based map (ML-16/ML-15). osmdroid was archived in 2024; MapLibre is maintained.
    implementation 'org.maplibre.gl:android-sdk:13.7.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
