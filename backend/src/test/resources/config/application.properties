# Test-only additions; Spring Boot reads classpath:/config/ on top of the main application.properties.
#
# Every integration test class with its own configuration starts its own application context, and
# the context cache keeps them open until the JVM ends. With Hikari's default of 10 connections each,
# 13 contexts asked the shared test PostgreSQL (max_connections 100) for 130 connections and the last
# ones failed to start. The busiest test (the memory lock test) uses 3 connections at once.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
