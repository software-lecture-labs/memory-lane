# Supply real credentials through environment variables; never commit them.
spring.application.name=memory-lane
server.port=${SERVER_PORT:8080}
# The API serves no static files; photos are only returned by protected endpoints (ML-29).
spring.web.resources.add-mappings=false

# PostgreSQL connection. backend/.env (shared with docker-compose.yml) is read when present,
# so the password is kept in one place; real environment variables still take precedence.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:memory_lane}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:memory_lane}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
# Fail fast with a clear message instead of waiting 30 s when the database is down.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}

# Schema is owned by Flyway migrations in db/migration; Hibernate only validates it.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# Photo uploads (ML-09). The exact 5,000,000-byte rule is checked in code so the error body follows
# the contract; this servlet limit (Spring's default is 1 MB) only stops much larger requests early.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
# Relative to the directory the backend is started from (backend/), so files go to backend/storage/photos.
memorylane.photos.directory=${MEMORYLANE_PHOTOS_DIRECTORY:storage/photos}
