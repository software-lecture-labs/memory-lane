# Supply real credentials through environment variables; never commit them.
spring.application.name=memory-lane
server.port=${SERVER_PORT:8080}

# PostgreSQL connection. backend/.env (shared with docker-compose.yml) is read when present,
# so the password is kept in one place; real environment variables still take precedence.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:memory_lane}
spring.datasource.username=${DB_USER:memory_lane}
spring.datasource.password=${DB_PASSWORD:}
# Fail fast with a clear message instead of waiting 30 s when the database is down.
spring.datasource.hikari.connection-timeout=5000

# Schema is owned by Flyway migrations in db/migration; Hibernate only validates it.
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
