plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.memorylane'
version = '0.1.0-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql:42.7.8'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }

def localConfigExcludes = ['**/application-local.properties', '**/application-local.yml',
    '**/application-local.yaml', '**/.env', '**/.env.*', '**/local.properties', '**/.gitkeep']

tasks.withType(org.gradle.language.jvm.tasks.ProcessResources).configureEach {
    exclude localConfigExcludes
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    rootSpec.exclude localConfigExcludes
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
