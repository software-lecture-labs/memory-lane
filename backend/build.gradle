plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.memorylane'
version = '0.1.0-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }

// Local credentials must stay outside classpath resources and packaged artifacts.
tasks.named('processResources') {
    exclude '**/application-local.properties', '**/application-local.yml', '**/application-local.yaml', '**/.gitkeep'
}

// Also exclude stale local resources left by an earlier build.
tasks.withType(Jar).configureEach {
    exclude '**/application-local.properties', '**/application-local.yml', '**/application-local.yaml'
}
