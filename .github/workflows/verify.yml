name: Verify
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew test bootJar --no-daemon
        working-directory: backend
      - name: Backend raporlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/build/reports/
            backend/build/test-results/test/*.xml
          retention-days: 14
          if-no-files-found: warn
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew assembleDebug lintDebug testDebugUnitTest --no-daemon
        working-directory: mobile
      - name: Mobil raporlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-reports
          path: |
            mobile/**/build/reports/
            mobile/**/build/test-results/**/*.xml
          retention-days: 14
          if-no-files-found: warn
